name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check addon.js
          node --check cryptoConfig.js
          node --check configValidation.js
          node --check lruCache.js
          node --check urlSafety.js
          node --check src/js/providers/directProvider.js
          node --check src/js/providers/xtreamProvider.js
          node --check src/js/tmdbMetadata.js
          node --check src/js/epgStreamParser.js
          node --check src/js/configure-common.js
          node --check src/js/direct-config.js
          node --check src/js/xtream-config.js
          node --check serverless.js
          node --check test.js
      - name: Run tests
        run: npm test
      - name: Audit all dependencies
        run: npm audit
