name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check addon.js
          node --check cryptoConfig.js
          node --check configValidation.js
          node --check lruCache.js
          node --check urlSafety.js
          node --check src/js/providers/directProvider.js
          node --check src/js/providers/xtreamProvider.js
          node --check src/js/tmdbMetadata.js
          node --check src/js/configure-common.js
          node --check src/js/direct-config.js
          node --check src/js/xtream-config.js
          node --check serverless.js
          node --check test.js
      - name: Run tests
        run: npm test
      - name: Audit all dependencies
        run: npm audit
