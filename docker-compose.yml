version: '3.8'
services:
  stremio_addon:
    build: .
    image: stremio-m3u-epg-addon:local
    container_name: stremio_addon
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      PERSISTENT_DATA_DIR: /data
    volumes:
      - addon-data:/data
    restart: unless-stopped
    # Uncomment below if you want to use Redis
    # depends_on:
    #   - redis

  # Optional Redis service
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   # Keep Redis off public interfaces; containers can use redis:6379 on the Compose network.
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   restart: unless-stopped

volumes:
  addon-data:
